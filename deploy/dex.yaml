issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: klisi
    name: klisi
    secret: klisi-dev-oidc-secret
    redirectURIs:
      - http://localhost:8080/api/auth/callback
      # Dev: the Vite origin proxies /api to the Go server, so the OIDC flow
      # must round-trip through it or the browser strands on the API origin.
      - http://localhost:5173/api/auth/callback

staticPasswords:
