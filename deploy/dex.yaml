issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: tide
    name: tide
    secret: tide-dev-oidc-secret
    redirectURIs:
      - http://localhost:8080/api/auth/callback
      # Dev: the Vite origin proxies /api to the Go server, so the OIDC flow
      # must round-trip through it or the browser strands on the API origin.
      - http://localhost:5173/api/auth/callback

staticPasswords:
  - email: host@tide.dev
    hash: $2y$10$mN23kC1VYg9sJSDPRpRsY.3lQwMESUhrAlhDPDlxTxUTvswSJ4QDu
    username: Tide host
    userID: 6f6fb3c0-86e0-4c08-85c5-cb6f5a649b4e
