# Egress needs SYS_ADMIN and an unconfined seccomp profile for headless Chrome.
# Put it in a namespace with an explicit Pod Security exception; do not weaken
# the policy for unrelated workloads. See docs/DEPLOYMENT.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-config
  labels:
    app.kubernetes.io/name: egress
    app.kubernetes.io/component: recording
data:
  egress.yaml: |
    # LIVEKIT_API_KEY and LIVEKIT_API_SECRET come from livekit-secrets.
    ws_url: ws://livekit:7880

    redis:
      address: redis:6379

    health_port: 8081

    # tide sends its destination and credentials with every recording request,
    # so these defaults are only for diagnostics or direct operator jobs.
    s3:
      region: us-east-1 # OVERLAY: Set the S3 signing region.
      endpoint: http://s3.storage.svc.cluster.local:9000 # OVERLAY: Set the egress-worker view of S3.
      bucket: tide-recordings # OVERLAY: Set the existing recording bucket.
      force_path_style: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
  labels:
    app.kubernetes.io/name: egress
    app.kubernetes.io/component: recording
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: egress
      app.kubernetes.io/component: recording
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress
        app.kubernetes.io/component: recording
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: egress
          image: livekit/egress:v1.13.0 # OVERLAY: Pin a release compatible with LiveKit server.
          imagePullPolicy: IfNotPresent
          env:
            - name: EGRESS_CONFIG_FILE
              value: /etc/egress.yaml
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: api-secret
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-secrets
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secrets
                  key: secret-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
            seccompProfile:
              type: Unconfined
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /etc/egress.yaml
              subPath: egress.yaml
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            - name: recordings
              mountPath: /recordings
            - name: tmp
              mountPath: /home/egress/tmp
      volumes:
        - name: config
          configMap:
            name: egress-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: recordings
          emptyDir: {}
        - name: tmp
          emptyDir: {}
