# Turns recording on for the tide Deployment in ../tide.yaml: tide gets the
# object store and the fixed media key, secret and Redis password the recorder
# shares, and Redis and the recorder run beside it in the same pod. Sharing
# the network namespace is what keeps this simple: Redis listens on
# 127.0.0.1:6379 only, where tide and the recorder both find it; the recorder
# signals at 127.0.0.1:7880 (the media server itself) and loads the layout
# page from localhost:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tide
spec:
  template:
    spec:
      initContainers:
        # A native sidecar (restartPolicy: Always; Kubernetes 1.29 or later):
        # it starts, and passes its startup probe, before tide and the
        # recorder start, and runs beside them for the pod's life. Nothing in
        # it is durable. The password reaches redis-server through a config
        # file on a memory volume, never its command line.
        - name: redis
          image: redis:7.4.8-alpine3.21 # OVERLAY: Pin by digest.
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              printf 'requirepass %s\n' "$REDISCLI_AUTH" > /data/redis.conf
              exec redis-server /data/redis.conf --bind 127.0.0.1 --port 6379 --save '' --appendonly no
          env:
            # redis-cli reads REDISCLI_AUTH too, so the probes authenticate.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: recorder-redis-password
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli -h 127.0.0.1 ping | grep -q PONG"]
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli -h 127.0.0.1 ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      containers:
        - name: tide
          env:
            - name: TIDE_MEDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: api-key
            - name: TIDE_MEDIA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: api-secret
            # The Redis sidecar above, in this pod.
            - name: TIDE_RECORDER_REDIS_ADDR
              value: 127.0.0.1:6379
            - name: TIDE_RECORDER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: recorder-redis-password
            - name: TIDE_S3_ENDPOINT
              value: http://s3.storage.svc.cluster.local:9000 # OVERLAY: Set the tide-server view of S3.
            - name: TIDE_S3_PUBLIC_ENDPOINT
              value: https://recordings.example.com # OVERLAY: Set the browser-reachable S3 origin used in presigned URLs.
            - name: TIDE_S3_RECORDER_ENDPOINT
              value: http://s3.storage.svc.cluster.local:9000 # OVERLAY: Set the recorder view of S3.
            - name: TIDE_S3_BUCKET
              value: tide-recordings # OVERLAY: Set the existing recording bucket.
            - name: TIDE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secrets
                  key: access-key
            - name: TIDE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secrets
                  key: secret-key
            - name: TIDE_S3_REGION
              value: us-east-1 # OVERLAY: Set the S3 signing region.
            - name: TIDE_RECORDER_TEMPLATE_URL
              value: http://localhost:8080/egress-template
        - name: recorder
          image: livekit/egress:v1.13.0 # OVERLAY: Pin a release tested with tide's media server.
          imagePullPolicy: IfNotPresent
          # The recorder checks Redis once at startup and exits without it;
          # the Redis sidecar is up before this container starts.
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: api-secret
            - name: RECORDER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: recorder-redis-password
            # Kubernetes expands $(RECORDER_REDIS_PASSWORD) when it starts the
            # container, so the password never appears in the spec. tide sends
            # each recording's S3 destination and credentials with the job, so
            # the recorder needs no storage settings of its own.
            - name: EGRESS_CONFIG_BODY
              value: |
                ws_url: ws://127.0.0.1:7880
                redis:
                  address: 127.0.0.1:6379
                  password: "$(RECORDER_REDIS_PASSWORD)"
                health_port: 8081
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
            seccompProfile:
              type: Unconfined
          ports:
            - name: recorder-health
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          # No readiness probe: the pod's readiness is tide's alone, so a busy
          # or restarting recorder never takes meetings out of service.
          startupProbe:
            httpGet:
              path: /
              port: recorder-health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: recorder-health
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: recorder-shm
              mountPath: /dev/shm
            - name: recorder-staging
              mountPath: /recordings
            - name: recorder-tmp
              mountPath: /home/egress/tmp
      volumes:
        - name: redis-data
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: recorder-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: recorder-staging
          emptyDir: {}
        - name: recorder-tmp
          emptyDir: {}
