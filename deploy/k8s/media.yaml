# The media server. Read docs/DEPLOYMENT.md#choose-the-webrtc-media-path
# before applying this base. It exposes signaling inside the cluster but deliberately exposes no
# public media path. An overlay must select and configure one media option.
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-config
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/component: media
data:
  config.yaml: |
    port: 7880

    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: false

    redis:
      address: redis:6379

    # LIVEKIT_KEYS supplies the key/secret map from media-secrets.
    webhook:
      api_key: replace-with-media-api-key # OVERLAY: Set the api-key identifier from media-secrets; do not put the API secret here.
      urls:
        - http://tide:8080/api/webhooks/media
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/component: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media
      app.kubernetes.io/component: media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media
        app.kubernetes.io/component: media
    spec:
      # OVERLAY: For media option (b), uncomment hostNetwork and dnsPolicy, or
      # use the commented hostPort fields below. Do not use both.
      # hostNetwork: true
      # dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # OVERLAY: Pin option (b) to the public-IP node, for example:
      # nodeSelector:
      #   tide/media: public
      containers:
        - name: media
          image: livekit/livekit-server:v1.13.4 # OVERLAY: Pin a media server release tested with the recorder.
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/media/config.yaml
            # OVERLAY: Options (a) and (b) must advertise the selected public
            # IPv4 address. Add: --node-ip, then the address as the next item.
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: keys
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: ice-tcp
              containerPort: 7881
              # OVERLAY: Media option (b): uncomment hostPort: 7881.
              # hostPort: 7881
              protocol: TCP
            - name: ice-udp
              containerPort: 7882
              # OVERLAY: Media option (b): uncomment hostPort: 7882.
              # hostPort: 7882
              protocol: UDP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: signal
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: signal
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/media/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: media-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: media
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/component: media
spec:
  selector:
    app.kubernetes.io/name: media
    app.kubernetes.io/component: media
  ports:
    - name: signal
      port: 7880
      targetPort: signal
      protocol: TCP

