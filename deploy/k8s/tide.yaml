apiVersion: apps/v1
kind: Deployment
metadata:
  name: tide
  labels:
    app.kubernetes.io/name: tide
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tide
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tide
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tide
          image: registry.example.com/tide:latest # OVERLAY: Use the image built from this repository.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TIDE_ADDR
              value: :8080
            - name: TIDE_BASE_URL
              value: https://meet.example.com # OVERLAY: Set the public HTTPS origin, with no trailing slash.
            - name: TIDE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: tide-secrets
                  key: session-secret
            - name: TIDE_DB_PATH
              value: /data/tide.db
            - name: TIDE_MEDIA_URL
              value: ws://media:7880
            - name: TIDE_MEDIA_PUBLIC_URL
              value: wss://media.example.com # OVERLAY: Set the browser-facing signaling URL.
            - name: TIDE_MEDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: api-key
            - name: TIDE_MEDIA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: api-secret
            - name: TIDE_OIDC_ISSUER
              value: https://id.example.com # OVERLAY: Set the external OIDC issuer URL exactly as published.
            - name: TIDE_OIDC_CLIENT_ID
              value: tide # OVERLAY: Set the registered OIDC client ID.
            - name: TIDE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tide-secrets
                  key: oidc-client-secret
            - name: TIDE_USER_GROUPS
              value: "" # OVERLAY: Optional comma-separated OIDC groups allowed to sign in.
            - name: TIDE_ADMIN_GROUPS
              value: "" # OVERLAY: Optional comma-separated OIDC groups that administer every room.
            - name: TIDE_S3_ENDPOINT
              value: http://s3.storage.svc.cluster.local:9000 # OVERLAY: Set the tide-server view of S3.
            - name: TIDE_S3_PUBLIC_ENDPOINT
              value: https://recordings.example.com # OVERLAY: Set the browser-reachable S3 origin used in presigned URLs.
            - name: TIDE_S3_RECORDER_ENDPOINT
              value: http://s3.storage.svc.cluster.local:9000 # OVERLAY: Set the recorder view of S3.
            - name: TIDE_S3_BUCKET
              value: tide-recordings # OVERLAY: Set the existing recording bucket.
            - name: TIDE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secrets
                  key: access-key
            - name: TIDE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secrets
                  key: secret-key
            - name: TIDE_S3_REGION
              value: us-east-1 # OVERLAY: Set the S3 signing region.
            - name: TIDE_RECORDER_TEMPLATE_URL
              value: http://tide:8080/egress-template
            - name: TIDE_TRUSTED_PROXIES
              value: "" # OVERLAY: Set ingress proxy IPs or CIDRs, comma-separated, if forwarded client IPs are needed.
            - name: TIDE_DEV_MODE
              value: "false"
            - name: TIDE_TRANSCRIPTS
              value: "false" # OVERLAY: Set "true" to run transcripts through moil (alpha); see docs/DEPLOYMENT.md.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tide-data
---
apiVersion: v1
kind: Service
metadata:
  name: tide
  labels:
    app.kubernetes.io/name: tide
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: tide
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tide-data
  labels:
    app.kubernetes.io/name: tide
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard # OVERLAY: Set a storage class with the required durability and topology.
  resources:
    requests:
      storage: 5Gi # OVERLAY: Size for SQLite state; recordings do not live here.
