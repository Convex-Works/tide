# The reference base: tide, signed in, with its media server inside it and no
# recording. Add the component in recording/ to record meetings. Read
# docs/DEPLOYMENT.md#kubernetes first: every `# OVERLAY:` line needs a value.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - tide.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: tide
    includeSelectors: false
