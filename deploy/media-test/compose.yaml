name: tide-media-test

# A sealed stack on a private /24. Nothing is published to the host: the
# browser under test runs inside `runner`, so every service is reachable only
# by its compose DNS name. Configuration is baked into images rather than
# bind-mounted because CI drives compose from inside a container, where host
# bind mounts do not resolve on the daemon's filesystem.
#
# tide runs its media server embedded, as a production install does, and the
# recorder shares tide's network namespace: the gate's only media processes
# are tide and the recorder.

services:
  # Real OIDC. Without a session the suite cannot reach /m/[slug], the lobby,
  # host token grants, moderation or recording — /api/dev/token mints only
  # non-host tokens, so those paths were previously untestable.
  dex:
    build:
      context: ../..
      dockerfile: deploy/media-test/dex.Dockerfile
    command: dex serve /etc/dex/config.yaml
    volumes:
      - dex-data:/var/dex
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:5556/dex/.well-known/openid-configuration || exit 1"
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      media:
        ipv4_address: ${TIDE_MEDIA_NET_PREFIX:-10.253.0}.6

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: tide
      MINIO_ROOT_PASSWORD: tide-dev-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      media:
        ipv4_address: ${TIDE_MEDIA_NET_PREFIX:-10.253.0}.7

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 tide tide-dev-minio &&
        mc mb --ignore-existing local/tide-recordings
    restart: "no"
    networks:
      media:
        ipv4_address: ${TIDE_MEDIA_NET_PREFIX:-10.253.0}.8

  egress:
    build:
      context: ../..
      dockerfile: deploy/media-test/egress.Dockerfile
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    # The recorder checks tide's Redis endpoint once at startup and exits if it
    # isn't there. tide's image has no shell for a healthcheck, so the recorder
    # waits for /healthz, which tide serves only once its media server and
    # Redis endpoint are up.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until wget -q -O /dev/null http://localhost:8080/healthz; do sleep 1; done;
        exec /entrypoint.sh
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    # Staging area for file egress before the S3 upload; egress runs non-root.
    tmpfs:
      - /recordings:mode=1777
    depends_on:
      tide:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    # The recorder shares tide's network namespace: it signals at
    # 127.0.0.1:7880 (the media server itself), reaches the Redis endpoint on
    # tide's loopback, and the media server's advertised address (the .4
    # address below) is the correct candidate for its Chrome too.
    network_mode: "service:tide"

  tide:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_TIDE_TEST: "true"
    environment:
      TIDE_ADDR: :8080
      TIDE_BASE_URL: http://tide:8080
      TIDE_DB_PATH: /data/tide.db
      TIDE_DEV_MODE: "true"
      # The media server runs inside tide (no TIDE_MEDIA_URL). Browsers signal
      # through tide's /rtc and send media to this address; the recorder uses
      # the same key, secret and Redis password (egress.yaml).
      TIDE_MEDIA_NODE_IP: ${TIDE_MEDIA_NET_PREFIX:-10.253.0}.4
      TIDE_MEDIA_API_KEY: devkey
      TIDE_MEDIA_API_SECRET: tide-dev-secret-please-change-0000000000
      TIDE_RECORDER_REDIS_PASSWORD: tide-dev-recorder-redis-password-please-change
      TIDE_OIDC_ISSUER: http://dex:5556/dex
      TIDE_OIDC_CLIENT_ID: tide
      TIDE_OIDC_CLIENT_SECRET: tide-dev-oidc-secret
      TIDE_S3_ENDPOINT: http://minio:9000
      TIDE_S3_PUBLIC_ENDPOINT: http://minio:9000
      TIDE_S3_RECORDER_ENDPOINT: http://minio:9000
      TIDE_S3_BUCKET: tide-recordings
      TIDE_S3_ACCESS_KEY: tide
      TIDE_S3_SECRET_KEY: tide-dev-minio
      # The recorder shares tide's network namespace.
      TIDE_RECORDER_TEMPLATE_URL: http://localhost:8080/egress-template
      # Every browser in the suite shares the runner's single container IP, so
      # the public per-IP defaults (10 joins/min) would throttle the gate.
      TIDE_JOIN_RATE_LIMIT: "10000"
      TIDE_WAIT_RATE_LIMIT: "10000"
      TIDE_LOGIN_RATE_LIMIT: "10000"
      # The media gate covers meetings and recording, as a public install
      # runs them: without transcripts.
      TIDE_TRANSCRIPTS: "false"
    depends_on:
      dex:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    tmpfs:
      - /data:mode=1777
    networks:
      media:
        ipv4_address: ${TIDE_MEDIA_NET_PREFIX:-10.253.0}.4

  runner:
    build:
      context: ../..
      dockerfile: deploy/media-test/runner.Dockerfile
    environment:
      CI: "true"
      TIDE_MEDIA_BASE_URL: http://tide:8080
      TIDE_MEDIA_DEX_URL: http://dex:5556
      TIDE_MEDIA_ARTIFACTS: /artifacts
      TIDE_MEDIA_SUITE: ${TIDE_MEDIA_SUITE:-deterministic}
      TIDE_NETWORK_CHAOS: ${TIDE_NETWORK_CHAOS:-false}
      TIDE_MESH_PARTICIPANTS: ${TIDE_MESH_PARTICIPANTS:-5}
      FC_SEED: ${FC_SEED:-}
      FC_COMMANDS: ${FC_COMMANDS:-75}
      FC_RUNS: ${FC_RUNS:-1}
    volumes:
      - media-artifacts:/artifacts
    depends_on:
      egress:
        condition: service_healthy
      tide:
        condition: service_started
    cap_add:
      - NET_ADMIN
    init: true
    # Many concurrent Chromium contexts publishing canvas/oscillator media.
    shm_size: 2gb
    networks:
      media:
        ipv4_address: ${TIDE_MEDIA_NET_PREFIX:-10.253.0}.5

networks:
  media:
    driver: bridge
    ipam:
      config:
        - subnet: ${TIDE_MEDIA_NET_PREFIX:-10.253.0}.0/24

volumes:
  media-artifacts:
  dex-data:
