port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

redis:
  address: redis:6379

keys:
  devkey: klisi-dev-secret-please-change-0000000000

# Recording status only advances when klisi receives egress webhooks; without
# this a recording stays "starting" forever.
webhook:
  api_key: devkey
  urls:
    - http://klisi:8080/api/webhooks/livekit
