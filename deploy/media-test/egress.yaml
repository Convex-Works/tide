api_key: devkey
api_secret: tide-dev-secret-please-change-0000000000
# 127.0.0.1: egress shares tide's network namespace (see compose.yaml). This is
# the media server inside tide, whose advertised address (10.253.0.4) is
# correct for egress's Chrome too.
ws_url: ws://127.0.0.1:7880

# The Redis tide's media server uses too, by its compose name (the recorder
# resolves it from tide's network namespace).
redis:
  address: redis:6379
  password: tide-dev-recorder-redis-password-please-change

health_port: 8081

s3:
  access_key: tide
  secret: tide-dev-minio
  region: us-east-1
  endpoint: http://minio:9000
  bucket: tide-recordings
  force_path_style: true
