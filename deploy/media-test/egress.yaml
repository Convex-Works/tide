api_key: devkey
api_secret: tide-dev-secret-please-change-0000000000
# localhost: egress shares tide's network namespace (see compose.yaml). This is
# the media server inside tide, whose advertised address (10.253.0.4) is
# correct for egress's Chrome too.
ws_url: ws://localhost:7880

# tide's Redis endpoint, on its loopback.
redis:
  address: localhost:6379
  password: tide-dev-recorder-redis-password-please-change

health_port: 8081

s3:
  access_key: tide
  secret: tide-dev-minio
  region: us-east-1
  endpoint: http://minio:9000
  bucket: tide-recordings
  force_path_style: true
