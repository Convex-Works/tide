# Media-gate OIDC provider. Identical in shape to deploy/dex.yaml, but the
# issuer and redirect URI are in-network names: the media stack publishes no
# host ports, so the browser under test reaches dex as http://dex:5556.
issuer: http://dex:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: tide
    name: tide
    secret: tide-dev-oidc-secret
    redirectURIs:
      - http://tide:8080/api/auth/callback

# Both users share the dev password (tide-dev). The owner manages rooms; the
# member is an ordinary authenticated user, so it exercises the lobby and the
# non-host token grant.
staticPasswords:
  - email: host@tide.dev
    hash: $2y$10$mN23kC1VYg9sJSDPRpRsY.3lQwMESUhrAlhDPDlxTxUTvswSJ4QDu
    username: Tide host
    userID: 6f6fb3c0-86e0-4c08-85c5-cb6f5a649b4e
  - email: member@tide.dev
    hash: $2y$10$mN23kC1VYg9sJSDPRpRsY.3lQwMESUhrAlhDPDlxTxUTvswSJ4QDu
    username: Tide member
    userID: 0d0a2f83-4a1c-4f3e-9a17-2f7f3f0c5c11
