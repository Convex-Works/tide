port: 7880

# The advertised address (--node-ip) is set in compose.yaml: it must be
# reachable by host browsers AND egress's in-container Chrome, so dev uses the
# host LAN IP (see deploy/.env), falling back to 127.0.0.1 (host-only).
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

redis:
  address: redis:6379

keys:
  devkey: klisi-dev-secret-please-change-0000000000

webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8080/api/webhooks/livekit
