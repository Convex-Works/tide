api_key: devkey
api_secret: tide-dev-secret-please-change-0000000000
# tide runs on the host with its media server inside it: the recorder signals
# through tide's /rtc and coordinates over tide's Redis endpoint.
ws_url: ws://host.docker.internal:8080

redis:
  address: host.docker.internal:6379
  password: tide-dev-recorder-redis-password-please-change

health_port: 8081

s3:
  access_key: tide
  secret: tide-dev-minio
  region: us-east-1
  endpoint: http://minio:9000
  bucket: tide-recordings
  force_path_style: true
