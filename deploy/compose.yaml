name: tide

# What tide doesn't contain. tide itself, with its media server and the
# recorder's Redis endpoint inside it, runs on the host (`make dev`).

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: tide
      MINIO_ROOT_PASSWORD: tide-dev-minio
    # Loopback only: the root credentials are public in this repo.
    ports:
      - "127.0.0.1:9000:9000"
      - "[::1]:9000:9000"
      - "127.0.0.1:9001:9001"
      - "[::1]:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tide]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 tide tide-dev-minio &&
        mc mb --ignore-existing local/tide-recordings
    restart: "no"
    networks: [tide]

  # The recorder. It reaches tide on the host: signaling through tide's /rtc,
  # jobs through tide's Redis endpoint (make dev sets
  # TIDE_RECORDER_REDIS_ADDR=:6379), and media through the LAN address tide
  # advertises (TIDE_MEDIA_NODE_IP in deploy/.env). With no LAN address that
  # falls back to 127.0.0.1, which the recorder can't reach: meetings work,
  # recordings don't.
  egress:
    image: livekit/egress:v1.13.0
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    # The recorder checks the Redis endpoint once at startup and exits if it
    # isn't there, so it waits for tide, which serves /healthz only once its
    # media server and Redis endpoint are up.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until wget -q -O /dev/null http://host.docker.internal:8080/healthz; do sleep 1; done;
        exec /entrypoint.sh
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    # Staging area for file egress before the S3 upload; egress runs non-root.
    tmpfs:
      - /recordings:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [tide]

  dex:
    image: ghcr.io/dexidp/dex:v2.43.1
    command: dex serve /etc/dex/config.yaml
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    ports:
      - "127.0.0.1:5556:5556"
      - "[::1]:5556:5556"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5556/dex/.well-known/openid-configuration || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tide]

networks:
  tide:
    driver: bridge

volumes:
  minio-data:
  dex-data:
