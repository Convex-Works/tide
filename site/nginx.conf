# The prerendered site (build/), as served at tide.convex.works. Pages are
# <path>.html; every doc is also <path>.md, for agents.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
    access_log off;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Content-hashed assets never change.
        location /_app/immutable/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ \.md$ {
            default_type text/markdown;
        }

        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }

        error_page 404 /404.html;
    }
}
