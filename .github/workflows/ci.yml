name: CI

# The same gate as .forgejo/workflows/ci.yml, on GitHub's hosted runners:
# the checks, then the whole real-SFU media suite. Images are built and
# pushed from Forgejo only.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Server vet
        working-directory: server
        run: go vet ./...
      - name: Server tests
        working-directory: server
        run: go test ./...
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web checks
        working-directory: web
        run: npm run check
      - name: Web formatting
        working-directory: web
        run: npx prettier --check .
      - name: Build SPA
        working-directory: web
        run: npx vite build
      - name: Prove test hooks are absent
        working-directory: web
        run: |
          if grep -R -E "__tideMediaTest|__tideRoom|Playback blocked by Tide test hook" build; then
            echo "Production build contains media test instrumentation."
            exit 1
          fi
      - name: Generate API types
        run: make gen
      - name: Check generated type drift
        run: git diff --exit-code -- web/src/lib/api/types.gen.ts

  media-e2e:
    # Lifecycle and recording scenarios, reliability, the seeded fuzzer and a
    # network-chaos rerun, against the real media server and recorder.
    runs-on: ubuntu-latest
    needs: [checks]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Full real-SFU media suite
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_JOB_ID: ${{ github.job }}
          TIDE_MEDIA_SUITE: deterministic
        run: ./scripts/run-media-tests.sh
      - name: Preserve media diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-e2e-${{ github.run_id }}
          path: artifacts/media
          if-no-files-found: error
