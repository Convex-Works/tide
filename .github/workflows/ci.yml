name: CI

# The same gate as .forgejo/workflows/ci.yml, on GitHub's hosted runners:
# the checks, then the whole real-SFU media suite. Images are built and
# pushed from Forgejo only.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Server vet
        working-directory: server
        run: go vet ./...
      - name: Server tests
        working-directory: server
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Annotate failed server tests
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|^panic:' "$RUNNER_TEMP/go-test.log" 2>/dev/null |
            head -50 | sed 's/^/::error title=go test::/' || true
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web checks
        working-directory: web
        run: npm run check
      - name: Web formatting
        working-directory: web
        run: npx prettier --check .
      - name: Build SPA
        working-directory: web
        run: npx vite build
      - name: Prove test hooks are absent
        working-directory: web
        run: |
          if grep -R -E "__tideMediaTest|__tideRoom|Playback blocked by Tide test hook" build; then
            echo "Production build contains media test instrumentation."
            exit 1
          fi
      - name: Browser specs against mocks
        # The mock API and fake SFU need no Docker, no tide and no sign-in.
        # Specs that need a live server are not listed here.
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test anonymous.spec.ts device-error-messages.spec.ts \
            device-errors.spec.ts ics.spec.ts machines.spec.ts meeting-chrome.spec.ts \
            new-room.spec.ts recording-off.spec.ts room-page.spec.ts transcripts-off.spec.ts
        run: make gen
      - name: Check generated type drift
        run: git diff --exit-code -- web/src/lib/api/types.gen.ts

  media-e2e:
    # Lifecycle and recording scenarios, reliability, the seeded fuzzer and a
    # network-chaos rerun, against the real media server and recorder.
    runs-on: ubuntu-latest
    needs: [checks]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Full real-SFU media suite
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_JOB_ID: ${{ github.job }}
          TIDE_MEDIA_SUITE: deterministic
        run: |
          set -o pipefail
          ./scripts/run-media-tests.sh 2>&1 | tee "$RUNNER_TEMP/media.log"
      - name: Annotate the media suite's failure
        if: failure()
        run: |
          # One annotation per log, kept under GitHub's size limit: its last
          # characters, or only the lines that look like errors.
          annotate() {
            [ -f "$2" ] || return 0
            sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' "$2" | $3 | tail -c 3500 | sed -e 's/%/%25/g' |
              awk -v title="$1" 'BEGIN { printf "::error title=%s::", title } { printf "%s%%0A", $0 } END { print "" }'
          }
          errors() { grep -iE 'error|fail|panic|exited with code|timed out' || true; }
          annotate "media suite: errors" "$RUNNER_TEMP/media.log" errors
          annotate "media suite: end" "$RUNNER_TEMP/media.log" cat
          annotate "media stack: end" artifacts/media/stack.log cat
      - name: Preserve media diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-e2e-${{ github.run_id }}
          path: artifacts/media
          if-no-files-found: error
