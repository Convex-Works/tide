name: Nightly media fuzzing

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Optional fast-check seed
        required: false
        type: string

jobs:
  media-fuzz:
    runs-on: docker
    timeout-minutes: 45
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04@sha256:b40b8af93baee90b83f29c834440873300c8478809535786dbf79fa836c086ac
    steps:
      - uses: actions/checkout@v4
      - name: Seeded browser fuzzing and Chromium network chaos
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_JOB_ID: ${{ github.job }}
          TIDE_MEDIA_SUITE: nightly
          TIDE_NETWORK_CHAOS: "true"
          FC_SEED: ${{ inputs.seed }}
          FC_COMMANDS: "100"
          FC_RUNS: "1"
        run: ./scripts/run-media-tests.sh
      - name: Preserve media diagnostics
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: nightly-media-${{ github.run_id }}
          path: artifacts/media
          if-no-files-found: error
