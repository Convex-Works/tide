name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server vet
        working-directory: server
        run: go vet ./...
      - name: Server tests
        working-directory: server
        run: go test ./...
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web checks
        working-directory: web
        run: npm run check
      - name: Web formatting
        working-directory: web
        run: npx prettier --check .
      - name: Build SPA
        working-directory: web
        run: npx vite build
      - name: Prove test hooks are absent
        working-directory: web
        run: |
          if grep -R -E "__tideMediaTest|__tideRoom|Playback blocked by Tide test hook" build; then
            echo "Production build contains media test instrumentation."
            exit 1
          fi
      - name: Browser specs against mocks
        # The mock API and fake SFU need no Docker, no tide and no sign-in.
        # Specs that need a live server are not listed here.
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test anonymous.spec.ts device-error-messages.spec.ts \
            device-errors.spec.ts ics.spec.ts machines.spec.ts meeting-chrome.spec.ts \
            new-room.spec.ts recording-off.spec.ts room-page.spec.ts transcripts-off.spec.ts
      - name: Generate API types
        run: make gen
      - name: Check generated type drift
        run: git diff --exit-code -- web/src/lib/api/types.gen.ts

  media-e2e:
    runs-on: docker
    # The whole media gate blocks every pull request: lifecycle and recording
    # scenarios, reliability, the seeded fuzzer and a network-chaos rerun.
    # Nothing is deferred to a nightly job.
    needs: [checks]
    timeout-minutes: 90
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04@sha256:b40b8af93baee90b83f29c834440873300c8478809535786dbf79fa836c086ac
    steps:
      - uses: actions/checkout@v4
      - name: Full real-SFU media suite
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_JOB_ID: ${{ github.job }}
          TIDE_MEDIA_SUITE: deterministic
        run: ./scripts/run-media-tests.sh
      - name: Preserve media diagnostics
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: media-e2e-${{ github.run_id }}
          path: artifacts/media
          if-no-files-found: error

  build:
    runs-on: docker
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build binary
        run: make build
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: tide
          path: bin/tide
          if-no-files-found: error

  docker:
    runs-on: docker
    needs: [checks, media-e2e]
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04@sha256:b40b8af93baee90b83f29c834440873300c8478809535786dbf79fa836c086ac
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          docker build --iidfile /tmp/tide-image-id --tag "tide:${SHA}" .
          echo "Built image ID: $(cat /tmp/tide-image-id)"
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "${REGISTRY_URL}" ] || [ -z "${REGISTRY_USER}" ] || [ -z "${REGISTRY_TOKEN}" ]; then
            echo "Registry secrets are unset; skipping image push."
            exit 0
          fi

          registry_path="${REGISTRY_URL#http://}"
          registry_path="${registry_path#https://}"
          registry_path="${registry_path%/}"
          registry_host="${registry_path%%/*}"
          image="${registry_path}/tide:${SHA}"

          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login "${registry_host}" --username "${REGISTRY_USER}" --password-stdin
          docker tag "tide:${SHA}" "${image}"
          push_output="$(docker push "${image}" 2>&1)"
          printf '%s\n' "${push_output}"
          digest="$(printf '%s\n' "${push_output}" \
            | sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' \
            | tail -n 1)"
          if [ -z "${digest}" ]; then
            echo "The registry did not return an image digest."
            exit 1
          fi
          echo "Pushed digest: ${digest}"
