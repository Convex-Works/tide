<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F5F0" />
    <!--
      Link previews. The SPA serves this same page for every path, so these
      stay generic: a shared meeting link never shows its room's name. The
      image is relative because a self-hosted tide's origin isn't known here.
    -->
    <title>tide</title>
    <meta name="description" content="Simple, self-hosted video meetings." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="tide" />
    <meta property="og:title" content="tide" />
    <meta property="og:description" content="Simple, self-hosted video meetings." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A tide meeting with four people" />
    <meta name="twitter:card" content="summary_large_image" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
